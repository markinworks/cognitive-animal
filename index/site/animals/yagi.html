<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>アルプスアイベックス型 — COGNITIVE ANIMAL</title>
<meta name="description" content="認知タイプ診断 COGNITIVE ANIMAL — アルプスアイベックス型の結果ページ" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-animal="yagi">
<div class="sheet">

<header class="site-header">
  <a class="brand" href="../index.html">COGNITIVE ANIMAL</a>
  <div class="lang-toggle">
    <button id="lang-jp" onclick="setLang('jp')" aria-current="true">JP</button>
    <span aria-hidden="true">/</span>
    <button id="lang-en" onclick="setLang('en')" aria-current="false">EN</button>
  </div>
</header>

<main class="page">

  <section class="result-header">
    <p class="result-eyebrow">診断結果</p>
    <p class="result-axis" id="axis-label"></p>
    <h1 class="result-name-jp" id="animal-name-jp"></h1>
    <p class="result-catchphrase-en" id="catchphrase-en"></p>
    <p class="result-catchphrase" id="catchphrase"></p>
  </section>

  <hr class="rule" />

  <section class="narrative">
    <h2 class="section-heading">世界の感じ方</h2>
    <p class="lede" id="lede"></p>
    <p id="narrative-opening"></p>
  </section>

  <hr class="rule" />

  <section class="narrative">
    <h2 class="section-heading">野生との共鳴</h2>
    <p class="narrative-label" id="survival-label"></p>
    <p id="narrative-survival"></p>
    <p id="narrative-bridge"></p>
    <p id="narrative-closing"></p>
  </section>

  <div class="page-break"></div>

  <section>
    <h2 class="section-heading" id="brain-heading"></h2>

    <div class="trait-block vak">
      <span class="trait-label" id="vak-label"></span>
      <ul class="trait-bullets" id="vak-bullets"></ul>
      <p class="trait-description" id="vak-description"></p>
    </div>

    <div class="trait-block eawp">
      <span class="trait-label" id="eawp-label"></span>
      <ul class="trait-bullets" id="eawp-bullets"></ul>
      <p class="trait-description" id="eawp-description"></p>
    </div>
  </section>

  <hr class="rule" />

  <section>
    <h2 class="section-heading">こんな場面も</h2>
    <ul class="pitfall-bullets" id="pitfall-bullets"></ul>
    <p class="prose"><span id="pitfall-description"></span></p>
  </section>

  <hr class="rule" />

  <section>
    <h2 class="section-heading" id="strategy-heading"></h2>

    <div class="strategy-item">
      <h3 class="strategy-title" id="strategy-title-vak"></h3>
      <p id="strategy-body-vak"></p>
    </div>

    <div class="strategy-item">
      <h3 class="strategy-title" id="strategy-title-eawp"></h3>
      <p id="strategy-strength"></p>
      <p id="strategy-scenarios"></p>
      <p id="strategy-questions"></p>
      <p id="strategy-resolution"></p>
    </div>
  </section>

  <hr class="rule" />

  <section>
    <h2 class="section-heading">他のタイプを見る</h2>
    <nav class="animal-index" id="animal-index" aria-label="12タイプ一覧"></nav>
  </section>

</main>

<footer class="site-footer">

  </a>
  <a href="mailto:hello@example.com" aria-label="お問い合わせ">
    <svg viewBox="0 0 24 24" width="17" height="17"><rect x="3" y="5" width="18" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 6l9 7 9-7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
  </a>
</footer>

</div>

<script src="../js/data.js"></script>
<script src="../js/render.js"></script>
</body>
</html>
