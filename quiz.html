<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>認知タイプを診断する — COGNITIVE ANIMAL</title>

<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="sheet">

<header class="site-header">
  <span class="brand">COGNITIVE ANIMAL</span>
</header>

  <div class="quiz-progress">
    <div class="quiz-progress-track">
      <div class="quiz-progress-fill" id="progress-fill"></div>
    </div>

  <ul class="quiz-options" id="options-list"></ul>

  <div class="quiz-nav">
    <button class="quiz-nav-btn quiz-back" id="back-btn" type="button">戻る</button>
    <button class="quiz-nav-btn quiz-next" id="next-btn" type="button">次へ</button>
  </div>

</div>

<script src="js/questions.js"></script>
